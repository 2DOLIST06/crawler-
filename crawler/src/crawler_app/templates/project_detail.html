{% extends 'base.html' %}{% block content %}<h1>{{project.name}}</h1><form method='post' action='/runs/create/{{project.id}}'><select name='mode'><option>http</option><option>browser</option></select><input name='max_pages' value='{{project.default_max_pages}}'><input name='max_depth' value='{{project.default_max_depth}}'><button>Run</button></form><ul>{% for r in runs %}<li><a href='/runs/{{r.id}}'>Run {{r.id}} {{r.status}}</a></li>{% endfor %}</ul>{% endblock %}
